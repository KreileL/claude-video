# Local service stack for the watch MCP server. Always run as project "watch-mcp":
#   docker compose -p watch-mcp up -d
#
# watch-whisper is shared by v1 and v2; watch-worker (v2) processes background
# jobs. The MCP servers themselves are started on demand by Claude Desktop
# (`docker run -i --rm ... watch-mcp:latest` for "watch", `watch-mcp:v2` for
# "watch-v2") and join watch-mcp-net. No host ports are published.
#
# v2 needs the image first (`docker build -t watch-mcp:v2 .`, or `up -d --build`).
# Paths: WATCH_INBOX_DIR (default D:/Inbox) and WATCH_SECRETS_DIR (default
# %USERPROFILE%/.config/watch/secrets) can be overridden in the environment.
#
# v3 (profile "v3"): watch-worker-v3 replaces watch-worker (never run both: two
# workers on one queue; the v3 worker waits while another heartbeat is fresh)
# and watch-telegram is the Telegram bot. Build `docker build -t watch-mcp:v3 .`,
# then `docker stop watch-mcp-worker` and
# `docker compose -p watch-mcp --profile v3 up -d watch-worker-v3 watch-telegram`.
# WATCH_ENTRADA_HOST_DIR is the vault's "00 - Entrada" (the only vault path mounted).
name: watch-mcp

services:
  watch-whisper:
    # speaches 0.8.3 (latest stable; 0.9.0 is still rc), CPU build, pinned by digest.
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    container_name: watch-mcp-whisper
    restart: unless-stopped
    # The image's own non-root "ubuntu" user, made explicit (it owns the model volume).
    user: "1000:1000"
    environment:
      # Unload idle models (STT and TTS share this TTL in speaches 0.8.x).
      WHISPER__TTL: "120"
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: "8"
      # nproc still reports every host core under a CFS quota; without this
      # OpenMP/ONNX spawn one thread per host core and get throttled.
      OMP_NUM_THREADS: "8"
      ENABLE_UI: "false"
      LOG_LEVEL: info
      # The xet backend caches chunks under ~/.cache/huggingface/xet, outside
      # the model volume, which fails on the read-only rootfs. Plain HTTP
      # downloads land straight in the volume.
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - watch-mcp-models:/home/ubuntu/.cache/huggingface/hub
    networks:
      - watch-mcp-net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 8
    mem_limit: 4g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  watch-whisper-v2:
    # v2's own Whisper. One large pt-BR model left watch-whisper (4 GB) at its
    # memory limit in the benchmark (cgroup memory.max hit ~39k times, ~3.5 GB of
    # heap kept after unloading), so v2 never loads models into the v1 service.
    # Same pinned image; the shared model volume is mounted read-only.
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    container_name: watch-mcp-whisper-v2
    restart: unless-stopped
    user: "1000:1000"
    environment:
      WHISPER__TTL: "120"
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: "8"
      OMP_NUM_THREADS: "8"
      ENABLE_UI: "false"
      LOG_LEVEL: info
      HF_HUB_DISABLE_XET: "1"
      # Models come from the shared volume; this service never downloads.
      HF_HUB_OFFLINE: "1"
      # Fewer glibc arenas: less heap kept after a large model is unloaded.
      MALLOC_ARENA_MAX: "2"
    volumes:
      - watch-mcp-models:/home/ubuntu/.cache/huggingface/hub:ro
    networks:
      - watch-mcp-net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 8
    mem_limit: 8g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  watch-worker:
    # v2: the job queue on watch-mcp-jobs (the stdio server only enqueues and reads).
    image: watch-mcp:v2
    build: .
    container_name: watch-mcp-worker
    restart: unless-stopped
    init: true
    entrypoint: ["python", "/app/worker.py"]
    user: "10001:10001"
    environment:
      WATCH_WHISPER_URL: http://watch-whisper-v2:8000/v1/audio/transcriptions
      # A 5-minute chunk on CPU can take minutes with the larger models.
      WATCH_WHISPER_TIMEOUT: "1800"
      # Chosen by the pt-BR benchmark (NOTES-mcp.md, "v2").
      WATCH_MODEL_FAST: Systran/faster-whisper-small
      WATCH_MODEL_ACCURATE: deepdml/faster-whisper-large-v3-turbo-ct2
      # Limits (defaults shown): 4 h of media, 4 GiB per download, 8 h per job,
      # 7-day retention, 20 GiB for the whole cache.
      WATCH_JOB_MAX_DURATION: "14400"
      WATCH_JOB_MAX_DOWNLOAD_BYTES: "4294967296"
      WATCH_JOB_TIMEOUT: "28800"
      WATCH_JOB_TTL: "604800"
      WATCH_JOBS_MAX_BYTES: "21474836480"
    volumes:
      - watch-mcp-jobs:/jobs
      - type: bind
        source: ${WATCH_INBOX_DIR:-D:/Inbox}
        target: /inbox
        read_only: true
      - type: bind
        source: ${WATCH_SECRETS_DIR:-${USERPROFILE}/.config/watch/secrets}
        target: /secrets
        read_only: true
    networks:
      - watch-mcp-net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 4
    mem_limit: 3g
    pids_limit: 256

  watch-worker-v3:
    # v3: the v2 worker plus post-processing (LLM summary, a folder per job in the
    # Holocron's "00 - Entrada", archived jobs). Same limits and hardening as v2.
    profiles: ["v3"]
    image: watch-mcp:v3
    build: .
    container_name: watch-mcp-worker-v3
    restart: unless-stopped
    init: true
    entrypoint: ["python", "/app/worker.py"]
    user: "10001:10001"
    environment:
      WATCH_WHISPER_URL: http://watch-whisper-v2:8000/v1/audio/transcriptions
      WATCH_WHISPER_TIMEOUT: "1800"
      WATCH_MODEL_FAST: Systran/faster-whisper-small
      WATCH_MODEL_ACCURATE: deepdml/faster-whisper-large-v3-turbo-ct2
      WATCH_JOB_MAX_DURATION: "14400"
      WATCH_JOB_MAX_DOWNLOAD_BYTES: "4294967296"
      WATCH_JOB_TIMEOUT: "28800"
      WATCH_JOB_TTL: "604800"
      WATCH_JOBS_MAX_BYTES: "21474836480"
      # Summary: gemini (default) | claude | none. Model checked on ai.google.dev.
      WATCH_RESUMO_PROVIDER: gemini
      WATCH_GEMINI_MODEL: gemini-3.8-flash
      WATCH_GEMINI_KEY_FILE: /run/secrets/gemini_api_key
      # 0 turns summaries off for local inbox files (they never leave the machine).
      WATCH_RESUMO_CAIXA_ENTRADA: "1"
      WATCH_ENTRADA_DIR: /entrada
      WATCH_UTC_OFFSET_HOURS: "-3"
    secrets:
      - gemini_api_key
    volumes:
      - watch-mcp-jobs:/jobs
      - type: bind
        source: ${WATCH_INBOX_DIR:-D:/Inbox}
        target: /inbox
        read_only: true
      # Cookies exactly as in v2 (no wider access).
      - type: bind
        source: ${WATCH_SECRETS_DIR:-${USERPROFILE}/.config/watch/secrets}
        target: /secrets
        read_only: true
      # Only the vault's "00 - Entrada", read-write; nothing else of the vault.
      - type: bind
        source: ${WATCH_ENTRADA_HOST_DIR:-${USERPROFILE}/Documents/Projetos/Obsidian/00 - Entrada}
        target: /entrada
    networks:
      - watch-mcp-net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 4
    mem_limit: 3g
    pids_limit: 256

  watch-telegram:
    # InstWhisperBot: long polling (outbound only, no webhook, no port). Enqueues
    # through mcp_server.enqueue_analysis; no vault, no cookies, no inbox.
    profiles: ["v3"]
    image: watch-mcp:v3
    container_name: watch-mcp-telegram
    restart: unless-stopped
    init: true
    entrypoint: ["python", "/app/telegram_bot.py"]
    user: "10001:10001"
    environment:
      WATCH_TELEGRAM_TOKEN_FILE: /run/secrets/telegram_bot_token
      WATCH_TELEGRAM_ALLOWED_USER: "1779779810"
    secrets:
      - telegram_bot_token
    volumes:
      - watch-mcp-jobs:/jobs
    networks:
      - watch-mcp-net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 512m
    pids_limit: 64

volumes:
  watch-mcp-models:
    name: watch-mcp-models
  watch-mcp-jobs:
    name: watch-mcp-jobs

networks:
  watch-mcp-net:
    name: watch-mcp-net
    driver: bridge
    # IPv6 egress: YouTube throttles this line's shared (CGNAT) IPv4 with 429 /
    # "confirm you're not a bot", not its IPv6. netguard's proxy tries IPv6 first.
    enable_ipv6: true

secrets:
  gemini_api_key:
    file: ${WATCH_SECRETS_DIR:-${USERPROFILE}/.config/watch/secrets}/gemini-api-key.txt
  telegram_bot_token:
    file: ${WATCH_SECRETS_DIR:-${USERPROFILE}/.config/watch/secrets}/telegram-bot-token.txt
